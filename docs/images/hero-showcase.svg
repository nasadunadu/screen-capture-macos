      <rect x="20" y="106" width="118" height="6" rx="3" fill="#2563EB"/>
      <rect x="20" y="120" width="140" height="6" rx="3" fill="#60A5FA"/>
      <rect x="20" y="134" width="88" height="6" rx="3" fill="#93C5FD"/>

