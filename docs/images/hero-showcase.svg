      <circle cx="16" cy="18" r="5" fill="#EF4444"/>
      <circle cx="32" cy="18" r="5" fill="#F59E0B"/>
      <circle cx="48" cy="18" r="5" fill="#10B981"/>
      <rect x="140" y="10" width="176" height="16" rx="4" fill="#E2E8F0"/>

      <!-- Simulated Metric Cards inside Captured Area -->
      <rect x="24" y="56" width="192" height="94" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="40" y="82" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">CAPTURE LATENCY</text>
      <text x="40" y="116" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">8.3 ms</text>
      <text x="40" y="136" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">▲ 120Hz WindowServer Safe</text>

      <rect x="236" y="56" width="196" height="94" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="252" y="82" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">OUTPUT FIDELITY</text>
      <text x="252" y="116" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">Retina 2x</text>
      <text x="252" y="136" fill="#6366F1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Lossless PNG / JPEG</text>

