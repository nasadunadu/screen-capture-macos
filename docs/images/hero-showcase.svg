  <rect x="1" y="1" width="1198" height="638" rx="21" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- Top Header Strip -->
  <g transform="translate(44, 34)">
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#8839EF" fill-opacity="0.18" stroke="#8839EF" stroke-opacity="0.45"/>
    <circle cx="16" cy="14" r="4.5" fill="#A855F7"/>
    <text x="28" y="18.5" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="12" font-weight="600">v0.5.0 · Apple Notarized</text>

    <text x="186" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="13" font-weight="500">Swift + ScreenCaptureKit · 100% On-Device · Zero Telemetry · Apple Silicon Native</text>
  </g>

