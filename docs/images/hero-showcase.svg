<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F111A"/>
      <stop offset="50%" stop-color="#171926"/>
      <stop offset="100%" stop-color="#121420"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8839EF"/>
      <stop offset="100%" stop-color="#5A46E8"/>
    </linearGradient>
    <linearGradient id="confirmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#5145CD"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#282B3C" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#1C1E2B" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
