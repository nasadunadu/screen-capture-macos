      <rect x="24" y="168" width="408" height="112" rx="10" fill="#0F172A"/>
      <rect x="42" y="188" width="140" height="8" rx="4" fill="#38BDF8" fill-opacity="0.8"/>
      <rect x="42" y="206" width="260" height="8" rx="4" fill="#94A3B8" fill-opacity="0.5"/>
      <rect x="42" y="224" width="210" height="8" rx="4" fill="#A78BFA" fill-opacity="0.7"/>
      <rect x="42" y="242" width="175" height="8" rx="4" fill="#34D399" fill-opacity="0.75"/>

