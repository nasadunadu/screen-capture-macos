      <rect x="20" y="188" width="124" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="202" width="142" height="6" rx="3" fill="#94A3B8"/>
      <rect x="20" y="216" width="130" height="6" rx="3" fill="#94A3B8"/>

      <rect x="12" y="248" width="160" height="64" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="20" y="260" width="108" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="274" width="138" height="6" rx="3" fill="#94A3B8"/>
      <rect x="20" y="288" width="116" height="6" rx="3" fill="#64748B"/>

      <rect x="12" y="320" width="160" height="52" rx="5" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="22" y="343" fill="#065F46" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10.5" font-weight="700">底部栏仅在收尾保留 1 次</text>
