  <g transform="translate(44, 82)" filter="url(#softShadow)">
    <rect x="0" y="0" width="540" height="514" rx="16" fill="#181B28" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <!-- Simulated Dimmed Screen Outside Selection -->
    <rect x="18" y="54" width="504" height="442" rx="12" fill="#0D0F17"/>

