      <rect x="24" y="208" width="142" height="8" rx="4" fill="#334155"/>
      <rect x="24" y="224" width="172" height="8" rx="4" fill="#94A3B8"/>
      <rect x="24" y="240" width="156" height="8" rx="4" fill="#94A3B8"/>
      <rect x="24" y="256" width="120" height="8" rx="4" fill="#64748B"/>

