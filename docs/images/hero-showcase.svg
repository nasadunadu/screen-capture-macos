      <rect x="0" y="0" width="456" height="304" stroke="#8839EF" stroke-width="2" fill="none"/>
      <!-- Top-Left Corner Ruler -->
      <path d="M -4 18 L -4 -4 L 18 -4" stroke="#8839EF" stroke-width="4" stroke-linecap="round"/>
      <!-- Top-Right Corner Ruler -->
      <path d="M 438 -4 L 460 -4 L 460 18" stroke="#8839EF" stroke-width="4" stroke-linecap="round"/>
      <!-- Bottom-Left Corner Ruler -->
      <path d="M -4 286 L -4 308 L 18 308" stroke="#8839EF" stroke-width="4" stroke-linecap="round"/>
      <!-- Bottom-Right Corner Ruler -->
